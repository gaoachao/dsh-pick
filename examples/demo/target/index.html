<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>dsh-pick · React sample</title>
  <style>
    :root{font:16px/1.6 system-ui,sans-serif;color:#25254a;background:#eceeff;color-scheme:light}
    *{box-sizing:border-box}body{margin:0}main{max-width:700px;margin:64px auto;padding:0 24px}
    .brand{font:700 14px ui-monospace,monospace;letter-spacing:1px;color:#4355db}
    h1{font-size:34px;letter-spacing:-1px;margin:20px 0 8px}
    p{color:#666680}section{background:#fbfbff;border:1px solid #dddff0;border-radius:12px;padding:28px;margin:28px 0}
    h2{font-size:20px;margin:0 0 20px}label{display:block;font-size:13px;font-weight:600;margin:16px 0}
    input,textarea,[contenteditable]{display:block;background:white;width:100%;border:1px solid #dddff0;border-radius:6px;padding:10px 12px;margin-top:6px;font:15px/1.5 system-ui,sans-serif;color:#25254a}
    button{border:0;border-radius:6px;background:#4355db;color:white;padding:12px 18px;font:600 14px system-ui,sans-serif;cursor:pointer}
    :focus-visible{outline:2px solid #b95882;outline-offset:3px}
    a{color:#4355db}small{color:#666680}
    @media(max-width:480px){main{margin:30px auto;padding:0 16px}section{padding:20px}}
  </style>
</head>
<body><div id="root"></div><script type="module" src="/main.js"></script></body>
</html>
